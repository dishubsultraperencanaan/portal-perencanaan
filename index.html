<style>
:root{--indigo:#2e1f6e;--indigo-2:#3d2b8a;--gold:#ffc20e;--bg:#f4f2fa;--panel:#fff;--ink:#1c1540;--muted:#5f5a7d;--line:#ddd8ee;--side:#241857;--side-ink:#efeafc}
@media (prefers-color-scheme:dark){:root{--bg:#120e26;--panel:#1c1640;--ink:#efeafc;--muted:#a59fc9;--line:#332b63;--side:#0e0a20}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex}
.side{width:220px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:16px 10px;flex-shrink:0;border-right:4px solid var(--gold)}
.brand{padding:0 6px 12px;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,.14)}
.logos{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.logos img{height:38px;width:auto}
.brand small{display:block;font-size:11.5px;opacity:.75;line-height:1.35}
.brand strong{display:block;font-size:14px;line-height:1.3;margin-top:4px;color:var(--gold)}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;text-decoration:none;margin-bottom:3px;font-size:14px;color:inherit}
nav a svg{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a small{display:block;font-size:12px;opacity:.7;margin-top:2px}
nav a:hover{background:rgba(255,255,255,.09)}
nav a[aria-current="page"]{background:var(--gold);color:#241857;font-weight:700}
nav a:focus-visible,.btn:focus-visible,.menu:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.foot{margin-top:auto;font-size:12px;opacity:.6;padding:10px 8px 0}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-height:54px}
.bar h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--indigo-2);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--gold);border-color:var(--gold);color:#241857}
.menu{display:none;font-size:20px;line-height:1;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.stage{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--panel)}
.loading{position:absolute;inset:0;z-index:2;background:var(--panel);display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;color:var(--muted);font-size:14px;pointer-events:none}
.spin{position:relative;width:104px;height:104px;display:grid;place-items:center}
.spin img{width:54px;height:auto;animation:pulse 1.4s ease-in-out infinite}
.ring{position:absolute;inset:0;border-radius:50%;border:4px solid rgba(255,194,14,.22);border-top-color:var(--gold);animation:rot 1s linear infinite}
.dots b{display:inline-block;animation:blink 1.2s infinite}
.dots b:nth-child(2){animation-delay:.2s}.dots b:nth-child(3){animation-delay:.4s}
.lbar{position:absolute;top:0;left:0;right:0;height:4px;overflow:hidden;background:rgba(255,194,14,.2)}
.lbar::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:var(--gold);animation:slide 1.3s ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.88);opacity:.8}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.home{height:100%;overflow:auto}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--indigo) 30%,var(--indigo-2));color:#fff;padding:44px 32px 64px}

.hero h2{margin:0 0 10px;font-size:clamp(24px,4vw,36px);line-height:1.15;max-width:18ch}
.hero p{margin:0;max-width:52ch;line-height:1.55;opacity:.88}
.hero .logos img{height:64px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.hero .logos{margin-bottom:20px}
.hero i{display:block;width:64px;height:5px;border-radius:3px;background:var(--gold);margin-bottom:18px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));max-width:980px;padding:0 32px 40px;margin-top:-36px;position:relative;z-index:1}
.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 24px rgba(36,24,87,.12);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.card{position:relative}
.badge{font-style:normal;font-size:10.5px;font-weight:700;background:var(--gold);color:#241857;padding:2px 8px;border-radius:999px;white-space:nowrap}
.card .badge{position:absolute;top:16px;right:16px}
nav a .badge{margin-left:auto}
.soon{cursor:default}
.card.soon{opacity:.6}
.card.soon:hover{transform:none;border-color:var(--line)}
nav a.soon{opacity:.6}
nav a.soon:hover{background:none}
.ico{width:48px;height:48px;border-radius:12px;background:var(--indigo);display:grid;place-items:center;margin-bottom:14px}
.ico svg{width:26px;height:26px;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card b{display:block;font-size:17px;margin-bottom:6px}
.card span{color:var(--muted);font-size:14px;line-height:1.5}
@media (max-width:820px){
 .side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s;max-width:86vw}
 body.open .side{transform:none}
 .menu{display:block}
 body.open .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:4}
 .hero{padding:32px 20px 56px}.grid{padding:0 20px 32px}
}
@media (prefers-reduced-motion:reduce){.side,.card{transition:none}.spin img,.ring,.dots b,.lbar::after{animation:none}}
</style>
</head>

  berkas:'<path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  survey:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  rka:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  dok:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.5"/>',
  kas:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',
  alat:'<path d="M14.7 6.3a4 4 0 00-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 005.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const APPS = [
  { id:"berkas", ico:"berkas", nama:"Penyimpanan berkas", ket:"Simpan dan cari berkas Subbag Perencanaan dan Evaluasi.", url:"https://script.google.com/macros/s/AKfycbykPg9Sz8FfoKRVtkcQqHYbSHbSCPpBtZBzK6SLI7eywUqByZYCJQbHBP_VjGlSClELSg/exec" },
  { id:"survey", ico:"survey", nama:"Form survey", ket:"Isi form survey dari Subbag Perencanaan dan Evaluasi.", url:"https://script.google.com/macros/s/AKfycbzZhokwaMORirHZNiLhdzIPxOaNHYaI6oCxh3fB09IzHHGMvjqNAx2l0eMzmGz7dVTisQ/exec" },
  { id:"rka",    ico:"rka",    nama:"Pengajuan RKA", ket:"Ajukan rencana anggaran RKA dari UPTD dan bidang.", url:"https://script.google.com/macros/s/AKfycbwkGy8mlbNQDYatrt3CT2RPctfmsk0LMB_PazQUg-BXB9JWHgbtbLTArxGQOFgRD6I8/exec" },
  { id:"dokumentasi", ico:"dok", nama:"Dokumentasi", ket:"Dokumentasi kegiatan Subbag Perencanaan dan Evaluasi.", url:"https://script.google.com/macros/s/AKfycbw-HONy_lMls7LbA3_lyGgFj3kFPTDkj80Jh5oWcx9IiV9F6d_P90iLmAhWGtKpEhvz/exec" },
  { id:"peralatan", ico:"alat", nama:"Peralatan", ket:"Kumpulan aplikasi bantu untuk menunjang pekerjaan sehari-hari.", url:"",
    sub:[
      { id:"kas-perjadin", ico:"kas", nama:"Kas Perjadin", ket:"Pencatatan kas perjalanan dinas.", url:"https://script.google.com/macros/s/AKfycbxnAwesrlG_rJzHiwMnatghEgHqnQHiTK9WmiaO3Xph61_S2IbuPd5JaOgHj7cN976HuQ/exec" }
    ] }
];

const nav = document.getElementById("nav"), stage = document.getElementById("stage");
const judul = document.getElementById("judul"), tabBaru = document.getElementById("tabBaru");

const kembali = document.getElementById("kembali");
const aktif = a => a.url || (a.sub && a.sub.length);

nav.innerHTML = `<a href="#/" data-id="">${svg("home")}<div>Beranda</div></a>` +
  APPS.map(a => aktif(a)
    ? `<a href="#/${a.id}" data-id="${a.id}">${svg(a.ico)}<div>${a.nama}</div></a>`
    : `<a class="soon" aria-disabled="true" data-id="${a.id}">${svg(a.ico)}<div>${a.nama}</div><em class="badge">Segera</em></a>`).join("");

const kartu = (a, href) => `<a class="card" href="${href}"><div class="ico">${svg(a.ico)}</div><b>${a.nama}</b><span>${a.ket}</span></a>`;

function viewIframe(nama, url){
  stage.innerHTML = `<div class="loading" id="ld" role="status"><div class="lbar"></div><div class="spin"><i class="ring"></i><img src="${LOGO}" alt=""></div><div>Memuat ${nama}<span class="dots"><b>.</b><b>.</b><b>.</b></span></div></div>
    <iframe id="frame" title="${nama}" allow="clipboard-write"></iframe>`;
  const f = document.getElementById("frame");
  const selesai = () => { const l = document.getElementById("ld"); if (l) l.remove(); };
  f.onload = selesai; setTimeout(selesai, 20000);
  f.src = url;
}

function tampil(){
  const [id, sid] = location.hash.replace(/^#\/?/, "").split("/");
  const app = APPS.find(a => a.id === id && aktif(a));
  nav.querySelectorAll("a").forEach(l => l.dataset.id === (app ? app.id : "")
    ? l.setAttribute("aria-current","page") : l.removeAttribute("aria-current"));
  document.body.classList.remove("open");
  kembali.hidden = true; tabBaru.hidden = true;

  if (!app){
    document.title = "Portal Perencanaan dan Evaluasi | Dishub Sultra";
    judul.textContent = "Beranda";
    stage.innerHTML = `<div class="home"><section class="hero"><div class="logos"><img src="${SULTRA}" alt="Logo Provinsi Sulawesi Tenggara"><img src="${LOGO}" alt="Logo Kementerian Perhubungan"></div><i></i>
      <h2>Portal Perencanaan dan Evaluasi</h2>
      <p>Layanan Subbag Perencanaan dan Evaluasi Dinas Perhubungan Provinsi Sulawesi Tenggara.</p></section>
      <div class="grid">` + APPS.map(a => aktif(a) ? kartu(a, "#/" + a.id)
        : `<a class="card soon" aria-disabled="true"><em class="badge">Segera hadir</em><div class="ico">${svg(a.ico)}</div><b>${a.nama}</b><span>${a.ket}</span></a>`).join("") +
      `</div></div>`;
    return;
  }

  if (app.sub){
    const sub = app.sub.find(s => s.id === sid && s.url);
    if (!sub){
      document.title = app.nama + " | Perencanaan dan Evaluasi Dishub Sultra";
      judul.textContent = app.nama;
      stage.innerHTML = `<div class="home"><section class="hero"><i></i><h2>${app.nama}</h2><p>${app.ket}</p></section>
        <div class="grid">` + app.sub.filter(s => s.url).map(s => kartu(s, `#/${app.id}/${s.id}`)).join("") + `</div></div>`;
      return;
    }
    document.title = sub.nama + " | Perencanaan dan Evaluasi Dishub Sultra";
    judul.textContent = app.nama + " \u203A " + sub.nama;
    kembali.href = "#/" + app.id; kembali.hidden = false;
    tabBaru.href = sub.url; tabBaru.hidden = false;
    viewIframe(sub.nama, sub.url);
    return;
  }

  document.title = app.nama + " | Perencanaan dan Evaluasi Dishub Sultra";
  judul.textContent = app.nama;
  tabBaru.href = app.url; tabBaru.hidden = false;
  viewIframe(app.nama, app.url);
}

document.getElementById("menu").onclick = () => document.body.classList.toggle("open");
document.getElementById("scrim").onclick = () => document.body.classList.remove("open");
addEventListener("hashchange", tampil);
tampil();
</script>
</body>
</html>
